const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scenes=[
{at:0,app:'mail',view:'morning',title:'Before the first call',chapter:'01 / Get oriented',action:'Read the overnight mail',why:'The building is already moving. Maya starts by finding what changed since Friday, not by reading every message in order.',question:'What needs an answer before a crew loses its work front?',tip:'Open the superintendent’s message. A work front is an area where a crew can work without another constraint stopping it.',known:'The ceiling conflict was reported Friday. No design response has arrived.',seam:'Authored day and correspondence. The office-first rhythm is informed by practitioner accounts.'},
{at:12,app:'procore',view:'Daily Log',title:'Yesterday is evidence',chapter:'01 / Get oriented',action:'Review Friday’s daily log',why:'Nine sheet-metal workers were on site. That says who attended; it does not prove how much duct they installed. Maya compares the note with the planned work.',question:'Does manpower tell us progress?',tip:'Open the manpower entry and the delay note. Daily logs are reports from people, not a live scan of the building.',known:'Friday’s report records a blocked area at Level 2, grid C/4.',seam:'Procore tool and log concepts are borrowed. Entries and quantities are fictional.'},
{at:30,app:'schedule',view:'lookahead',title:'Find the dependency',chapter:'02 / Protect the week',action:'Compare the two-week look-ahead',why:'Duct rough-in must finish before the above-ceiling inspection. The superintendent can move the crew to the east wing today, but the west corridor still needs a solution.',question:'Which date is exposed—and which date is not yet proven to move?',tip:'Select activity M-240. A look-ahead is a near-term work plan; it is not a full critical-path analysis.',known:'West rough-in is planned for September 14–16; inspection is booked for September 17.',seam:'Illustrative look-ahead, not a Primavera P6 or Microsoft Project screen. No critical-path claim.'},
{at:50,app:'procore',view:'RFIs',title:'Who has the ball?',chapter:'02 / Protect the week',action:'Follow up RFI #087',why:'The open question belongs with the design team. Maya asks for a response today and explains the inspection dependency, without directing the subcontractor to improvise a design.',question:'Who must act next?',tip:'Ball In Court identifies who owes the next action. RFI means Request for Information.',known:'RFI #087 is Open. Elena Park, the mechanical engineer, is the assignee.',seam:'Real Procore field names, reconstructed record. Due dates are this project’s assumptions.'},
{at:75,app:'navis',view:'clash',title:'See the conflict',chapter:'03 / Coordinate',action:'Join the VDC screen-share',why:'Luis, the VDC coordinator, shares a Navisworks Manage view: supply duct meets a structural beam. Maya needs the location, affected trade, and decision—not a model-editing session.',question:'Is this a geometry problem, an installation fact, or both?',tip:'Select Clash 014. A detected clash is model evidence; the field team separately confirms the location.',known:'The coordinated models show a 3-inch overlap. RFI #087 asks for a viable route.',seam:'Simplified schematic geometry. Clash Detective terminology is borrowed; this is not a BIM model.'},
{at:100,app:'revit',view:'sheet',title:'Check the promise',chapter:'03 / Coordinate',action:'Review the designer’s sheet and schedule',why:'The engineer shares Revit to locate the duct and check the design information. The issued sheet is the reference for this question; the working model alone does not settle contractual precedence.',question:'Which revision is the team actually building from?',tip:'Switch between the sheet and Duct Schedule. In Revit, a schedule can be a table of model elements, not a calendar.',known:'Issued M2.12 revision 2 shows the west corridor route. The structural beam is on S2.02.',seam:'Revit Project Browser / Sheets / Schedules grammar is borrowed. Design dimensions are illustrative.'},
{at:120,app:'mail',view:'followup',title:'Now, the waiting',chapter:'03 / Coordinate',action:'Document the call and wait for design',why:'Maya sends a concise recap: exact location, affected inspection, and who owes what. The crew works the east wing. An unanswered email is still an unresolved dependency.',question:'What can proceed while this answer is outstanding?',tip:'The full timeline includes waiting. Scrub to another event whenever you like; playback remains one second per second.',known:'A response is requested by noon. No approved reroute exists yet.',seam:'Invented timing. Nothing is automatically escalated by a hidden prediction engine.'},
{at:145,app:'procore',view:'Submittals',title:'A second clock is ticking',chapter:'04 / Keep the rest moving',action:'Review the rooftop-unit submittal',why:'The rooftop-unit product data came back Revise and Resubmit. A long lead item can miss the required-on-site date even when nobody on site is waiting for it today.',question:'Is approval complete enough to release fabrication?',tip:'A submittal presents product or shop-drawing information for review. An RFI asks a question. They are different records.',known:'Submittal 23 74 00-1 revision 1 needs corrected electrical data. Release is not confirmed.',seam:'Fictional procurement thread; response labels follow common Procore practice and are configurable.'},
{at:175,app:'excel',view:'procurement',title:'The shadow sheet',chapter:'04 / Keep the rest moving',action:'Check the procurement tracker',why:'The official review record lives in Procore. Maya’s workbook joins it to the supplier’s lead time and the required-on-site date. The spreadsheet is useful precisely because someone maintains those links.',question:'What assumption is hidden in a delivery date?',tip:'Edit the lead-time cell. The date uses calendar days here, explicitly—not working days.',known:'Assumed release September 18 plus 56 calendar days gives November 13; required on site November 9.',seam:'Custom Excel workbook. The formula is simulated in the browser; no live workbook connection.'},
{at:205,app:'site',view:'walk',title:'Leave the desk',chapter:'05 / Check the field',action:'Walk Level 2 with the superintendent',why:'Maya and Rafael confirm the affected corridor and the east-wing work front. The walk supplies context that a colored model cannot. Luis keeps responsibility for model coordination.',question:'What did we observe, and what are we still assuming?',tip:'Open the field notes. This 30-minute walk is 5% of this ten-hour demo, not a claim about all PMs.',known:'No west-corridor reroute has been installed. The east-wing crew can continue today.',seam:'Schematic field illustration and invented observation notes; no site photograph or scan.'},
{at:235,app:'mail',view:'response',title:'An answer is not an order',chapter:'06 / Convert the answer',action:'Read the engineer’s RFI response',why:'The engineer permits a lower route subject to the stated coordination conditions. Maya still needs trade pricing, installation duration, and the project’s authorization process.',question:'Did a design answer also authorize extra money?',tip:'Open the RFI response. Separate technical direction, commercial approval, and field execution.',known:'The response is now available. Added cost and schedule impact remain to be evaluated.',seam:'Fictional engineering response for education; not construction direction.'},
{at:255,app:'procore',view:'Change Events',title:'Capture the exposure',chapter:'06 / Convert the answer',action:'Create Change Event #024',why:'Maya records the potential change against the affected subcontract. A change event tracks exposure; it does not mean the owner approved payment or the subcontract amount changed.',question:'Where should an unpriced change live?',tip:'ROM means Rough Order of Magnitude. It is an estimate, not the subcontractor’s final price.',known:'CE #024 is Open. The working cost ROM is $8,000; scope is marked TBD.',seam:'Procore change-event concepts are borrowed. Configuration, IDs, and cost codes are chosen for this demo.'},
{at:280,app:'mail',view:'lunch',title:'A quiet half hour',chapter:'06 / Convert the answer',action:'Lunch, voicemail, routine correspondence',why:'The quote is still outstanding. Nothing in the records proves the west corridor is back on plan. Maya uses the gap for routine email and lunch.',question:'Does no new information mean the risk went away?',tip:'You can jump directly to 12:10 PM for the quote, or explore any record available now.',known:'No quotation received yet. Today’s reroute authorization remains outstanding.',seam:'Authored quiet interval. No new project evidence arrives in this segment.'},
{at:310,app:'mail',view:'quote',title:'Put a price on the answer',chapter:'07 / Reconcile the money',action:'Read Summit Mechanical’s quotation',why:'The subcontractor prices the reroute at $9,600 and asks for one additional workday. Maya checks the breakdown and whether the claimed time actually affects the inspection.',question:'What is priced, and what still needs checking?',tip:'Open Q-119. A quoted day of trade effort is not automatically a day added to project completion.',known:'Q-119: $4,800 labor + $3,200 material + $800 equipment + $800 markup = $9,600.',seam:'Invented quote with explicit arithmetic. No owner approval is implied.'},
{at:340,app:'excel',view:'exposure',title:'Two numbers, one obligation',chapter:'07 / Reconcile the money',action:'Reconcile the cost forecast',why:'Maya replaces the $8,000 placeholder with the $9,600 quote. Keeping both would count the same exposure twice. The subcontract remains $420,000 until an approved change changes it.',question:'Why does the forecast move before the commitment?',tip:'Edit the quote amount. The workbook shows a selected scope only, not the total project budget.',known:'Mechanical projected budget $438,000; forecast $429,600; remaining headroom $8,400.',seam:'Custom shadow-sheet logic. The simplified budget excludes other mechanical exposures in this fictional scope.'},
{at:375,app:'procore',view:'Budget',title:'Bring the record up to date',chapter:'07 / Reconcile the money',action:'Review the selected budget line',why:'The CE cost estimate is updated to $9,600. In this demo’s chosen budget configuration it appears in Pending Cost Changes. The projected over/under is $8,400.',question:'Are we forecasting a cost or authorizing it?',tip:'Open the budget calculation. Procore budget columns and change-order tiers vary by company configuration.',known:'No approved commitment change order exists. Owner recovery remains uncertain.',seam:'Real budget column names; simplified, explicitly configured source mapping.'},
{at:405,app:'cmb',view:'logistics',title:'Give the delivery somewhere to go',chapter:'08 / Coordinate the next move',action:'Review cmBuilder with the superintendent',why:'A separate delivery needs the west gate tomorrow. The logistics scenario tests where a truck and temporary laydown can fit while keeping the planned access route clear.',question:'Does a site plan prove the area will be available?',tip:'Switch Milestones. A scenario is a planning alternative, not live evidence of equipment locations.',known:'Tomorrow’s logistics plan moves laydown east. The superintendent still needs to confirm the area is clear.',seam:'cmBuilder Scenario / Milestone / Resources language. Flat schematic, no validated clearance or lifting analysis.'},
{at:440,app:'schedule',view:'risk',title:'Protect the inspection',chapter:'08 / Coordinate the next move',action:'Test the one-day impact',why:'If west rough-in finishes September 17, the inspection booked for that day needs coordination. Maya records an exposed handoff and asks Rafael to confirm resequencing, rather than declaring a project delay.',question:'Can resequencing preserve the inspection window?',tip:'Use the scenario control. This is a deterministic illustration of local dependencies, not a probability forecast.',known:'Trade duration is claimed, not accepted. The baseline stays visible beside the scenario.',seam:'Proposed teaching interaction; not native Procore, P6, or Navisworks functionality.'},
{at:480,app:'mail',view:'owner',title:'Say what is known',chapter:'09 / Close the loop',action:'Prepare the owner update',why:'The update separates design resolution, pending price, and schedule exposure. Maya asks for a decision through the agreed change process and names the next owner of each action.',question:'Can the owner tell the difference between fact and forecast?',tip:'Open the update. Notice “pending” and “subject to confirmation”—these are consequential distinctions.',known:'$9,600 proposed; inspection at risk; no approved change order, no verified project-completion delay.',seam:'Authored communication. It is not sent anywhere.'},
{at:530,app:'procore',view:'Closeout',title:'Leave tomorrow a clean trail',chapter:'09 / Close the loop',action:'Review the handoff list',why:'The day ends with a technical answer, a better cost forecast, and unresolved approvals. Maya assigns follow-ups so the next person can act without reconstructing the entire day.',question:'What is still open at 5 PM?',tip:'Check off items in your exploration. Reset restores the recorded handoff; the scenario does not pretend every problem is solved.',known:'Commercial approval, inspection confirmation, revised coordination check, and RTU resubmittal remain open.',seam:'Fictional end-of-day handoff. Tutorial checkboxes do not update Procore.'},

const lectures=[
{body:["A PM begins with change. Rafael’s email says three useful things: where work stopped, what can continue, and which decision is missing.","Maya does not redesign the duct. She turns an ambiguous field problem into an owned question with a deadline, while the crew keeps an available work front."],evidence:"West corridor held · east wing available · engineer’s answer needed before Thursday’s inspection.",principle:"Read the inbox as a map of dependencies."},
{body:["A daily log is evidence, but each entry has limits. Nine people working eight hours proves 72 reported labor hours. It does not prove how much duct was installed.","Maya pairs the manpower entry with the delay note. Together they establish attendance and a blocked location—still not production."],evidence:"9 workers × 8 hours = 72 reported hours. Delay noted at Level 2, C/4.",principle:"Use every record for what it proves—no more."},
{body:["The look-ahead turns the field issue into a sequence: duct rough-in, then inspection, then ceiling closure. The risk sits at the handoff between them.","The west corridor may finish late. At 7:30 AM, that does not prove the project will finish late; the east wing can continue and the full schedule has not been analyzed."],evidence:"West rough-in: Sep 14–16 → inspection: Sep 17 → ceiling closure: Sep 18.",principle:"Protect the next handoff before declaring a project delay."},
{body:["An RFI makes uncertainty actionable. It attaches the question to a location, drawing references, an assignee, and a due date.","“Ball In Court” names who owes the next move. Maya’s follow-up explains the time consequence without inventing the engineer’s answer."],evidence:"RFI 087 · Open · Ball In Court: Elena Park · due today.",principle:"A good question carries enough context to be answered."},
{body:["Navisworks shows a geometric conflict: two coordinated model elements occupy the same space. The three-inch overlap is model evidence, not proof of what is installed in the corridor.","Luis owns model coordination. Maya needs the location, affected trade, and decision path so she can keep cost and schedule moving."],evidence:"Clash 014 · ductwork vs structural · Active · assigned to VDC.",principle:"A clash finds a question; it does not settle the field condition."},
{body:["Revit describes the designed building. Here, the issued mechanical sheet shows the promised route; the structural sheet locates the beam.","A Revit “schedule” can be a table of model elements, such as duct sizes. It is not the construction schedule. Maya also checks revision numbers because a correct answer on the wrong revision is still wrong."],evidence:"M2.12 rev 2 · S2.02 rev 1 · Duct Schedule SA-2W-01.",principle:"First establish which version defines the promise."},
{body:["After the call, the work becomes waiting—but controlled waiting. Maya records the location, the affected inspection, the requested response time, and who owns the answer.","Meanwhile, the crew stays productive in the east wing. The constraint remains open; it is simply contained."],evidence:"Response requested by noon. East-wing rough-in continues.",principle:"Waiting is managed when the next owner and checkpoint are explicit."},
{body:["A submittal answers a different question from an RFI. The RFI asks what the design requires. This submittal asks whether the proposed rooftop unit information is acceptable.","“Revise and Resubmit” means the review cycle is still open. With an eight-week lead time, a paperwork delay today can become a field delay in November."],evidence:"23 74 00-1 rev 1 · Revise and Resubmit · fabrication release unconfirmed.",principle:"Long-lead risk starts before anyone on site is waiting."},
{body:["The shadow sheet joins facts that live in different places: Procore’s review status, the supplier’s lead time, and the schedule’s required-on-site date.","Its power is the connection. Its weakness is the manual assumption. September 18 plus 56 calendar days lands on November 13—four days after the need date."],evidence:"Assumed release Sep 18 + 56 calendar days = Nov 13; required Nov 9.",principle:"A forecast is only as trustworthy as its visible assumptions."},
{body:["The model showed a clash. The field walk checks what the screens cannot: whether the reroute was installed and whether another work area is genuinely available.","Maya and Rafael confirm the west corridor is untouched and the east wing can carry today’s crew. They return with observations, not a fabricated percent complete."],evidence:"West reroute not installed · east work front available · location matches C/4.",principle:"Use the field to test the story told by the records."},
{body:["The engineer’s response resolves the technical question: lower the duct, maintain clearances, and verify coordination before installation.","That answer opens two different decisions. What will the trade charge? Can the work still meet the inspection? Design direction is not commercial authorization."],evidence:"Technical route answered · price unknown · duration unknown · authorization pending.",principle:"Closing one uncertainty usually transfers the work to another record."},
{body:["A Change Event gives a possible cost a home before it is approved. Maya links the reroute to the RFI, subcontract, and cost code, then enters an $8,000 rough estimate.","Early visibility prevents the cost from disappearing. The record still says Open and scope TBD: neither entitlement nor payment has been decided."],evidence:"CE 024 · Open · $8,000 ROM · SC-023 · scope TBD.",principle:"Forecast exposure early; keep approval status honest."},
{body:["Nothing new arrives for half an hour. The absence of a message does not reduce the risk, and it does not justify escalating the estimate.","Maya can work elsewhere because the next checkpoint is known: Summit owes pricing, and the design response is already documented."],evidence:"No quote yet · no written change authorization · east-wing work continues.",principle:"Silence changes neither the evidence nor the next owner."},
{body:["Summit’s quote makes the commercial claim inspectable: $9,600, built from labor, material, equipment, and markup. It also requests one additional workday.","Maya now tests two things separately—the price basis and the schedule consequence. One day of trade effort does not automatically add one day to project completion."],evidence:"$4,800 + $3,200 + $800 + $800 = $9,600 · one day requested.",principle:"A quotation is a claim with a basis, not an approved outcome."},
{body:["The $9,600 quote replaces the $8,000 rough estimate. Adding both would count the same reroute twice.","The forecast changes because expected cost changed. The signed subcontract does not: SC-023 stays at $420,000 until an approved change modifies it."],evidence:"Projected budget $438,000 − forecast $429,600 = $8,400 headroom.",principle:"Keep contracted, expected, and recoverable cost separate."},
{body:["The Procore budget makes the working forecast part of the project record. In this demo’s configuration, the open Change Event appears under Pending Cost Changes.","The arithmetic is clear: $420,000 committed plus $9,600 pending equals $429,600 projected cost. Against $438,000, that leaves $8,400. It is neither approval nor whole-project profit."],evidence:"Committed $420,000 + pending $9,600 = projected $429,600.",principle:"A budget forecast describes expectation; a change order changes the contract."},
{body:["cmBuilder lets the team rehearse tomorrow spatially. Moving laydown east appears to clear the west-gate approach for a delivery.","That is a proposed logistics state. Rafael still has to verify the area in the field and communicate the plan; the simulation cannot prove the space is clear."],evidence:"Milestone 01: west laydown · Milestone 02: proposed east laydown.",principle:"A logistics model is a rehearsal, not live site truth."},
{body:["Summit’s requested day moves west-corridor completion onto the same date as the inspection. That exposes the handoff; it does not yet move project completion.","Maya asks whether Rafael can resequence, preserve part of the inspection, or rebook it. The local scenario shows where judgment is needed without pretending to be a critical-path analysis."],evidence:"Scenario finish Sep 17 · inspection booked Sep 17 · ceiling closure Sep 18.",principle:"Model the immediate consequence, then verify the larger schedule effect."},
{body:["A useful owner update separates three states: the design is resolved, the price is proposed, and the schedule is exposed.","Maya avoids turning uncertainty into certainty. She says who owns pricing, inspection coordination, and the revised model check, so the update can produce decisions."],evidence:"$9,600 proposed · inspection at risk · no approved CO · no verified completion delay.",principle:"Communicate facts, forecasts, and decisions as different things."},
{body:["The day ends with open work, so Maya transfers state rather than offering reassurance. Each handoff names a person, a next action, and the evidence that will close it.","Tomorrow’s team should not have to reconstruct today from six applications and an inbox."],evidence:"Approval · inspection · revised clash check · RTU resubmittal · laydown confirmation.",principle:"A clean handoff preserves the reasoning, not just the task list."},
{body:["At 7 AM, Maya had an ambiguous field note. At 5 PM, she has a technical answer, a priced exposure, a corrected forecast, and named owners for what remains.","The building did not magically catch up. The accomplishment is smaller and more valuable: uncertainty was converted into records and decisions the team can act on."],evidence:"RFI answered · CE priced · subcontract unchanged · inspection still exposed.",principle:"Project management is the disciplined reduction of uncertainty."}
];
const apps=[['mail','Outlook','#317db0'],['procore','Procore','#ee783e'],['excel','Excel','#28865f'],['schedule','Look-ahead','#8b7999'],['navis','Navisworks','#4c8cad'],['revit','Revit','#547da7'],['cmb','cmBuilder','#417d76']];
let seconds=0,playing=false,idx=0,activeApp='mail',view='morning',exploring=false,quote=9600,lead=56,delay=1,milestone=0,modelView='sheet',mailSelected=null,tick=performance.now();
const time=(s,secs=false)=>{let t=7*3600+Math.floor(s),h=Math.floor(t/3600),m=Math.floor(t%3600/60);return `${h%12||12}:${String(m).padStart(2,'0')}${secs?':'+String(t%60).padStart(2,'0'):''} ${h>=12?'PM':'AM'}`};
function sceneAt(s){let i=0;for(let n=0;n<scenes.length;n++)if(s>=scenes[n].at*60)i=n;return i}
function badge(t,c=''){return `<span class="tag ${c}">${t}</span>`}
function table(headers,rows,cls=''){return `<div class="tablewrap"><table class="${cls}"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function link(id,label){return `<button class="link" onclick="record('${id}')">${label}</button>`}
function markExplore(){if(playing){playing=false;$('play').textContent='▶ Play'}exploring=true;$('explore').classList.add('visible')}
function restore(){quote=9600;lead=56;delay=1;milestone=0;modelView='sheet';mailSelected=null;exploring=false;$('explore').classList.remove('visible');activeApp=scenes[idx].app;view=scenes[idx].view}
function seek(s){playing=false;$('play').textContent='▶ Play';seconds=Math.max(0,Math.min(36000,Number(s)));idx=sceneAt(seconds);restore();render();$('modal').close()}
function resetScene(){restore();render();toast('Restored the authored state at '+time(seconds))}
function togglePlay(){if(playing){playing=false;$('play').textContent='▶ Play';return}if(seconds>=36000)seconds=0;idx=sceneAt(seconds);restore();playing=true;tick=performance.now();render();$('modal').close()}
function stepScene(n){seek(scenes[Math.max(0,Math.min(scenes.length-1,idx+n))].at*60)}
function openApp(app){markExplore();activeApp=app;view=app==='procore'?'RFIs':app==='excel'?(seconds<20400?'procurement':'exposure'):app==='schedule'?'lookahead':app==='mail'?scenes[idx].view:'sheet';mailSelected=null;renderScreen();renderNav()}
function renderNav(){$('appnav').innerHTML=apps.map(a=>`<button class="${activeApp===a[0]?'active':''}" aria-pressed="${activeApp===a[0]}" onclick="openApp('${a[0]}')"><span class="appdot" style="background:${a[2]}"></span>${a[1]}</button>`).join('')}
function renderClock(){$('clock').textContent=time(seconds,true);$('desktopTime').textContent='Mon 9/14/2026 · '+time(seconds);$('elapsed').textContent=`${Math.floor(seconds/3600)}h ${String(Math.floor(seconds%3600/60)).padStart(2,'0')}m / 10h · real time`;$('scrub').value=Math.floor(seconds);$('play').textContent=playing?'Ⅱ Pause':'▶ Play'}
function render(){renderClock();renderNav();renderScreen();renderCommentary();renderFilm()}
function renderCommentary(){let s=scenes[idx],l=lectures[idx];$('commentary').innerHTML=`<div class="chapter">${s.chapter}<span class="stepcount">${idx+1} / ${scenes.length}</span></div><h2>${s.title}</h2><div class="moment">${time(s.at*60)} · ${s.action}</div><div class="lecture">${l.body.map(p=>`<p>${p}</p>`).join('')}</div><div class="evidence"><span>Read this on screen</span>${l.evidence}</div><div class="principle">${l.principle}</div><details><summary>Source seam</summary><p>${s.seam}</p></details><button class="darkbtn" onclick="askMoment()">Ask about this moment ↗</button>`}
function renderFilm(){let picks=[0,2,4,7,9,10,13,14,16,17,19];$('film').innerHTML=picks.map((n,j)=>`<button class="${idx>=n&&idx<(picks[j+1]??99)?'current':''}" onclick="seek(${scenes[n].at*60})" onmouseenter="previewAt(${scenes[n].at*60},event)" onmouseleave="hidePreview()" aria-label="${time(scenes[n].at*60)} ${scenes[n].title}"><small>${time(scenes[n].at*60)}</small><span>${scenes[n].title}</span></button>`).join('')}
function previewAt(s,e){let n=sceneAt(s),sc=scenes[n],p=$('preview'),rect=$('scrub').getBoundingClientRect();p.innerHTML=`<div class="mini" aria-hidden="true"><div class="thumbcanvas">${thumbnail(n)}</div></div><strong>${time(s)} · ${sc.title}</strong><p>${sc.action}</p>`;p.style.left=Math.max(0,Math.min(rect.width-235,(e?.clientX??rect.left)-rect.left-115))+'px';p.classList.add('show')}
const thumbCache={};
function thumbnail(n){if(thumbCache[n])return thumbCache[n];const saved=[seconds,activeApp,view,mailSelected,modelView,quote,lead,delay,milestone];const sc=scenes[n];seconds=sc.at*60;activeApp=sc.app;view=sc.view;mailSelected=null;modelView='sheet';quote=9600;lead=56;delay=1;milestone=0;let html=screenHtml().replace(/\s(id|onclick|oninput|onchange)="[^"]*"/g,'').replace(/<(button|input|select|textarea)\b/g,'<$1 tabindex="-1"');[seconds,activeApp,view,mailSelected,modelView,quote,lead,delay,milestone]=saved;return thumbCache[n]=html}
function hidePreview(){$('preview').classList.remove('show')}
$('scrub').addEventListener('input',e=>seek(e.target.value));$('scrub').addEventListener('pointermove',e=>{let r=e.target.getBoundingClientRect();previewAt(Math.max(0,Math.min(36000,(e.clientX-r.left)/r.width*36000)),e)});$('scrub').addEventListener('pointerleave',hidePreview);
setInterval(()=>{if(!playing)return;let now=performance.now();seconds=Math.min(36000,seconds+(now-tick)/1000);tick=now;let next=sceneAt(seconds);if(next!==idx){idx=next;restore();render()}else renderClock();if(seconds>=36000){playing=false;renderClock()}},200);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)||$('modal').open)return;if(e.code==='Space'){e.preventDefault();togglePlay()}if(e.key==='ArrowRight'){e.preventDefault();seek(seconds+60)}if(e.key==='ArrowLeft'){e.preventDefault();seek(seconds-60)}});
function appHead(name,sub,cls=''){return `<div class="apphead ${cls}"><span class="brand">${name}</span><span>${sub}</span></div>`}
function screenHtml(){if(activeApp==='procore')return procore();if(activeApp==='mail')return mail();if(activeApp==='excel')return excel();if(activeApp==='schedule')return schedule();if(activeApp==='navis')return navis();if(activeApp==='revit')return revit();if(activeApp==='cmb')return cmb();if(activeApp==='site')return site();return ''}
function renderScreen(){$('screen').innerHTML=screenHtml()+`<div class="footnote">EDUCATIONAL RECONSTRUCTION · Fictional project records · Simplified interface, no live connection · <a href="#" onclick="showSources();return false">What is borrowed?</a></div>`}
const sections=['RFIs','Submittals','Drawings','Daily Log','Change Events','Commitments','Budget','Closeout'];
function setView(v){markExplore();view=v;renderScreen()}
function procore(){let tabs=`<div class="tabs">${sections.map(v=>`<button class="${view===v?'selected':''}" onclick="setView('${v}')">${v}</button>`).join('')}</div>`,body='',responded=seconds>=14100,ce=seconds>=15300,priced=seconds>=22500;
if(view==='RFIs'){body=`<h2>RFIs</h2><div class="toolbar"><input aria-label="Search RFI table" placeholder="Search RFIs…" oninput="filterRows(this.value)"><span class="tag">3 records · example subset</span></div>`+table(['#','Subject','Status','Ball In Court','Due date'],[['087',link('rfi','Level 2 west corridor — duct / beam conflict'),badge(responded?'Closed':'Open',responded?'good':'warn'),responded?'—':'Elena Park','Sep 14, 2026'],['086',link('rfi86','Door hardware at loading vestibule'),badge('Open'),'Jon Bell','Sep 16, 2026'],['083',link('rfi83','Exterior wall control-joint alignment'),badge('Closed','good'),'—','Sep 10, 2026']])+`<div class="note">${responded?'RFI #087 has a designated official response. Commercial approval is still separate.':'RFI #087 needs design clarification. The superintendent has moved the crew to the east wing.'}</div>`}
else if(view==='Submittals'){body=`<h2>Submittals</h2>`+table(['Number','Title','Revision','Status','Ball In Court','Response'],[['23 74 00-1',link('submittal','Packaged rooftop units — product data'),'1','Open','Sam Ortiz',badge('Revise and Resubmit','warn')],['09 29 00-2',link('drywall','Gypsum board assemblies'),'0','Closed','—',badge('Approved as Noted','good')]])+`<div class="note">Review responses are project-configurable. “Revise and Resubmit” is not a fabrication release.</div>`}
else if(view==='Drawings'){body=`<h2>Drawings</h2>`+table(['Drawing no.','Title','Revision','Drawing date','Set'],[['M2.12',link('drawing','Level 2 mechanical plan'),'2','Aug 28, 2026','Issued for Construction'],['S2.02',link('structure','Level 2 framing plan'),'1','Aug 21, 2026','Issued for Construction'],['A2.12',link('ceiling','Level 2 reflected ceiling plan'),'2','Aug 28, 2026','Issued for Construction']])+`<div class="note">References in this demo are issued sheets. Actual contractual precedence depends on the project agreements.</div>`}
else if(view==='Daily Log'){body=`<h2>Daily Log <span class="subtle">Friday, September 11</span></h2><div class="stats"><div class="stat"><small>Reported manpower</small><b>42</b><small>people · all listed trades</small></div><div class="stat"><small>Reported labor hours</small><b>336</b><small>attendance × hours</small></div><div class="stat"><small>Reported delays</small><b>1</b><small>location-specific</small></div></div>`+table(['Log type','Company / location','Entry','Reported by'],[['Manpower',link('manpower','Summit Mechanical'),'9 workers × 8 hours = 72 hours','Rafael Diaz'],['Manpower','Other listed trades','33 workers × 8 hours = 264 hours','Rafael Diaz'],['Delay',link('delay','Level 2 · west corridor · C/4'),'Duct route blocked; RFI #087 open','Rafael Diaz'],['Delivery',link('delivery','North loading area'),'Gypsum board received; quantity per ticket','Rafael Diaz']])}
else if(view==='Change Events'){body=`<h2>Change Events</h2>`+(ce?table(['Number','Title','Status','Scope','Cost ROM'],[['024',link('ce','L2 west corridor duct reroute'),badge('Open','warn'),'TBD',money(priced?9600:8000)]])+`<div class="note warm">Potential change only. ${priced?'Quote received and estimate updated.':'Budgetary estimate pending quotation.'} No approved commitment change order.</div>`:`<div class="empty">CE #024 has not been created yet.<br>It enters the authored record at 11:15 AM.</div>`)}
else if(view==='Commitments'){body=`<h2>Commitments</h2>`+table(['Number','Title','Status','Original amount','Approved COs','Revised amount'],[['SC-023',link('commitment','Summit Mechanical — HVAC'),badge('Approved','good'),'$420,000','$0','$420,000']])+`<div class="note">The signed subcontract amount remains $420,000. A quotation or change event alone does not increase it.</div>`}
else if(view==='Budget'){let pending=ce?(priced?9600:8000):0;body=`<h2>Budget <span class="subtle">Selected scope</span></h2><div class="toolbar">${badge('Procore Standard Budget · simplified columns')} ${badge('Demo configuration')}</div>`+table(['Cost code','Projected Budget','Committed Costs','Pending Cost Changes','Forecast to Complete','Estimated Cost at Completion','Projected Over/Under'],[[link('budget','23-31-00.S · HVAC duct scope'),'$438,000','$420,000',money(pending),'$0',money(420000+pending),money(18000-pending)]])+`<div class="note">${ce?'Open CE cost estimates are included in Pending Cost Changes in this selected configuration.':'No pending change has been entered for this issue yet. The risk can exist before the budget shows it.'} Direct Costs = $0 for this demonstration row. <button class="link" onclick="record('budget')">Inspect calculation</button></div>`}
else{body=`<h2>Tomorrow’s handoff</h2>`+(seconds<31800?`<div class="empty">The end-of-day handoff is not available yet. Jump to 3:50 PM to review it.</div>`:`<p class="subtle">Authored checklist · not a native Procore tool</p><div class="checklist">${[['Elena / Luis','Verify revised model coordination before installation.'],['Maya','Obtain commercial direction on CE #024 / $9,600.'],['Rafael','Confirm September 17 inspection window or resequence.'],['Sam','Return corrected RTU electrical data for resubmittal.'],['Rafael','Confirm east laydown area before tomorrow’s delivery.']].map(r=>`<label><input type="checkbox" onchange="markExplore()"><strong>${r[0]}</strong> — ${r[1]}</label>`).join('')}</div><div class="note warm">Design clarification is complete. Commercial approval and schedule confirmation remain open.</div>`)}
return appHead('PROCORE','Alder Construction  /  Northline Commons','procore')+`<div class="inner"><div class="crumb">Project tools / ${view}</div>${tabs}${body}</div>`}
function filterRows(q){document.querySelectorAll('#screen tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q.toLowerCase()))}

{id:'morning',at:0,from:'Rafael Diaz · Superintendent',subject:'L2 west corridor — still waiting on RFI 087',body:'Maya,<br><br>Summit confirmed Friday that the main supply duct conflicts with the beam at C/4. West corridor is held. We can keep the crew on east-wing rough-in today.<br><br>We need the engineer’s direction to protect Thursday’s above-ceiling inspection. Can you follow up this morning?<br><br>Rafael',rec:'delay'},

else{body=`<div class="formula"><span>F2</span><span>ƒx</span><span>=SUM(C2:E2) &nbsp; &nbsp; | &nbsp; G2 = B2-F2</span></div><div class="inner"><h2>Change exposure <span class="subtle">Selected mechanical scope</span></h2>`+table(['','A · Cost code','B · Projected budget','C · Commitment','D · Pending exposure','E · Other forecast','F · Forecast total','G · Headroom'],[['2','23-31-00.S','$438,000','$420,000',hasQuote?`<input type="number" min="0" max="1000000" value="${quote}" aria-label="Pending quotation amount" onchange="updateQuote(this.value)">`:money(amount),'$0',money(420000+amount),money(18000-amount)]],'sheet')+`<div class="note">${hasQuote?'Q-119 replaces the $8,000 ROM. It is not added on top of it.':ce?'$8,000 ROM entered; no quotation available yet.':'No estimate entered yet. An empty forecast is not proof that no risk exists.'}</div>`+table(['Reconciliation item','Official record','PM working view'],[['Subcontract SC-023','$420,000 approved','$420,000'],['CE #024',ce?money(seconds>=22500?9600:8000):'Not created',money(amount)],['Owner recovery','Not approved','Excluded from assumed recovery']])+`<div class="subtle" style="margin-top:15px">Illustrative Excel grammar and editable cells. No macros, workbook engine, or live Procore synchronization.</div></div>`}
return appHead('Excel','Northline_PM_Tracker.xlsx · local working copy','excel')+`<div class="ribbon">Home Insert Formulas Data Review View</div>${body}<div class="toolbar" style="padding:0 20px"><button onclick="setView('exposure')">Change exposure</button><button onclick="setView('procurement')">Procurement</button></div>`}

function schedule(){let risk=seconds>=18600;return appHead('Two-week look-ahead','Rafael Diaz · issued Friday Sep 11')+`<div class="inner"><div class="crumb">Coordination attachment / illustrative spreadsheet view</div><h2>Level 2 · protect the inspection</h2><div class="toolbar">${badge('Baseline stays fixed')} ${badge('Local dependency only','warn')}</div>`+table(['Activity / owner','Baseline','Mon 14','Tue 15','Wed 16','Thu 17','Fri 18'],[[link('activity','M-240 · West duct / Summit'),'Sep 14–16','<div class="bar">Rough-in</div>','<div class="bar">Rough-in</div>','<div class="bar">Finish</div>',risk&&delay?'<div class="bar risk">Scenario</div>':'—','—'],['M-250 · East duct / Summit','Sep 14–16','<div class="bar">Rough-in</div>','<div class="bar">Rough-in</div>','<div class="bar">Finish</div>','—','—'],[link('inspection','Q-310 · Above-ceiling inspection'),'Sep 17','—','—','—','<div class="bar risk">Booked</div>','—'],['A-410 · Ceiling closure / Finch','Sep 18','—','—','—','—','<div class="bar">Planned</div>']], 'gantt')+`<div class="note warm">${risk?'The trade requests one extra workday. Inspection readiness needs confirmation.':'West-corridor work is constrained by RFI #087. East-wing resequencing is the current plan.'} No verified project-completion delay is established.</div>${risk?`<label class="subtle">Explore additional workdays <input type="range" min="0" max="3" value="${delay}" aria-label="Additional workdays" oninput="updateDelay(this.value)"> <b>${delay} day${delay!==1?'s':''}</b></label><p id="scenarioResult">${delay===0?'Scenario: west rough-in finishes Sep 16; inspection readiness still requires field verification.':`Scenario: west rough-in finishes Sep ${delay===1?'17':delay===2?'18':'21'}. September 17 inspection is exposed; coordinate or rebook before ceiling closure.`}</p>`:''}<div class="subtle">Assumptions: Monday–Friday workweek, finish-to-start local handoffs, no overtime. This simplified scenario excludes the full network and float.</div></div>`}

div><button onclick="record('logistics')">Open logistics coordination note</button></div>`}

const rows=o=>`<div class="fields">${Object.entries(o).map(([k,v])=>`<div><label>${k}</label>${v}</div>`).join('')}</div>`;
if(id==='rfi'){title='RFI #087 · Duct / beam conflict';body=rows({'Status':after?'Closed':'Open','Ball In Court':after?'—':'Elena Park','RFI Manager':'Maya Chen','Assignee':'Elena Park · mechanical engineer','Created':'September 11, 2026','Due':'September 14, 2026','Location':'Level 2 / west corridor / C/4','References':'M2.12 rev 2 · S2.02 rev 1 · Clash 014'})+`<h3>Question</h3><p>The modeled supply duct intersects the structural beam at grid C/4. Please clarify the route and required clearances. West rough-in is constrained pending direction.</p>${after?'<h3>Official response · 10:55 AM</h3><p>Lower the affected duct route, maintaining required clearances and coordination with the reflected ceiling plan. Submit a revised coordination view for verification before installation. No structural modification is directed.</p><div class="note warm">Illustrative technical response only. It does not authorize added cost, accept the claimed duration, or replace a coordinated construction detail.</div>':'<div class="note warm">No response received as of this moment. Do not infer a solution from the schematic model.</div>'}<button onclick="record('drawing')">M2.12 reference</button> <button onclick="record('clash')">Clash 014</button>${hasCE?' <button onclick="record(\'ce\')">CE #024</button>':''}`}

else if(id==='ce'){title='Change Event #024';body=hasCE?rows({'Title':'L2 west corridor duct reroute','Status':'Open','Scope':'TBD','Origin':'RFI #087','Commitment':'SC-023 · Summit Mechanical','Cost code':'23-31-00.S · demo cost code','Cost ROM':money(priced?9600:8000),'Owner recovery':'Not approved'})+`<p>${priced?'Working cost estimate updated from $8,000 to the $9,600 quotation.':'Initial $8,000 rough estimate entered; quote evaluation pending.'}</p><div class="note warm">This record does not create an approved change order. Scope/cost entitlement is not resolved by setting a number here.</div>${hasQuote?'<button onclick="record(\'quote\')">Inspect Q-119</button>':''}`:'<p>Not created yet. CE #024 enters the record at 11:15 AM.</p>'}
else if(id==='budget'){let pending=hasCE?(priced?9600:8000):0;title='Budget calculation · selected scope';body=`<p>This demo uses a simplified Procore Standard Budget view, with open CE cost estimates included in Pending Cost Changes. Actual company configurations vary.</p>`+table(['Column','Value / calculation'],[['Projected Budget','$438,000'],['Committed Costs','$420,000'],['Direct Costs','$0 in this example'],['Pending Cost Changes',money(pending)],['Projected Costs',`$420,000 + ${money(pending)} = ${money(420000+pending)}`],['Forecast to Complete','$0 additional beyond projected costs'],['Estimated Cost at Completion',`${money(420000+pending)} + $0`],['Projected Over/Under',`$438,000 − ${money(420000+pending)} = ${money(18000-pending)}`]])+`<div class="note">This is one selected scope. $8,400 of headroom after the quote is not project profit and is not owner approval.</div>`}

const sources=[

function showSources(){modal('Sources & seams',`<h2>A reconstruction you can inspect.</h2><p>This is a fictional US commercial GC project during interior rough-in. Maya Chen, Alder Construction, Northline Commons, all documents, timestamps, costs, geometry and correspondence were authored for this demo. No PM was recorded.</p><p><b>Borrowed:</b> product names, selected field names, record relationships and documented capabilities.<br><b>Reconstructed:</b> interfaces, project artifacts and the day’s timing.<br><b>Proposed:</b> this player, commentary, scenario controls and Codex handoff.</p><div class="note">The supplied Tyler call is qualitative inspiration. Its 5% field-time estimate is used only for this day. Broad claims about tool adoption or updates are not treated as industry facts. Excel is a custom shadow sheet; the look-ahead is not a branded scheduling product.</div>${sources.map(s=>`<div class="source"><a href="${s[1]}" target="_blank" rel="noreferrer">${s[0]} ↗</a><small>${s[2]}</small></div>`).join('')}<p class="subtle">Sources consulted September 2026. Product layouts and company configuration vary. This demo borrows working grammar, not pixel-exact screenshots.</p>`)}
function showGlossary(){modal('Field guide',`<h2>Just enough to read the desk.</h2>`+table(['Term','Meaning here'],[['GC','General contractor: coordinates delivery and subcontracted work.'],['PM','Project manager: commercial, schedule, documentation and team coordination.'],['Superintendent','Leads and coordinates field execution.'],['VDC','Virtual Design and Construction: model coordination and related workflows.'],['RFI','Request for Information: a documented question requiring clarification.'],['Submittal','Product data, shop drawings or samples submitted for review.'],['Ball In Court','Person who owes the next action on a record.'],['Commitment','A subcontract or purchase order in Procore.'],['Change Event','Potential change tracked before or during change-order processing.'],['ROM','Rough Order of Magnitude: an early estimate.'],['Forecast to Complete','Additional forecast cost needed to finish, under the selected budget method.'],['Look-ahead','Near-term work plan showing upcoming activities and constraints.'],['Float','Schedule flexibility before an activity affects a controlling milestone.'],['Milestone','In cmBuilder, a step/snapshot in the logistics scenario timeline.']])+`<div class="note">Space: play/pause · Left/right arrow: move one minute · Timeline: any second · Event buttons: jump to a chapter. Playback is real time; nothing is compressed.</div><p>Pause and open records, change workbook inputs, compare logistics milestones, or test local schedule assumptions. Reset moment or Play discards exploration changes. Closing the browser also resets the demo.</p>`)}
function contextPacket(){let s=scenes[idx];return `PM DAY v1 | September 14, 2026 | ${time(seconds,true)} | scene ${idx+1}/${scenes.length}\nThis is an educational reconstruction, not actual project evidence.\nScene: ${s.title}. ${s.action}.\nVisible app: ${activeApp}; view: ${view}.\nKnown now: ${s.known}\nPM question: ${s.question}\nContext: Northline Commons, fictional US GC project. RFI 087 duct/beam conflict at L2 C/4; SC-023 $420,000; selected projected budget $438,000.\n${seconds>=15300?'CE 024 exists. ':''}${seconds>=18600?'Q-119 received: $9,600, one extra workday requested. ':''}${seconds>=22500?'Budget estimate updated to $9,600. ':''}\nExploration: ${exploring?`temporary local changes/view navigation; quote input $${quote}, lead ${lead} calendar days, additional duration ${delay} working days, logistics milestone ${milestone+1}`:'none; authored state'}.\nSource seam: ${s.seam}\nUse the companion pm-day-guide.md or this HTML if available. Explain this moment in plain language. Do not infer approval, installation or critical-path delay without evidence.\nMy question: `}
function askMoment(){modal('Ask about this moment',`<h2>${time(seconds)} · ${scenes[idx].title}</h2><p>Copy this short context into a new Codex task and add your question. The timestamp identifies the scene; the included facts let the question work without sharing files.</p><textarea id="packet" aria-label="Context for a new Codex task">${esc(contextPacket())}</textarea><div class="toolbar"><button onclick="copyPacket()">Copy context</button><button onclick="downloadPacket()">Save context .txt</button></div><div class="note">This offline file does not create a task or run a chatbot. No data is sent. The companion guide contains the complete scene index if you want a deeper conversation.</div>`)}
async function copyPacket(){try{await navigator.clipboard.writeText($('packet').value);toast('Context copied. Paste it into a new Codex task.')}catch(e){$('packet').select();toast('Context selected. Press Ctrl+C to copy.')}}
function downloadPacket(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([$('packet').value],{type:'text/plain'}));a.href=url;a.download='pm-day-context-'+Math.floor(seconds)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3500)}
render();
</script></body></html>
